<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summer Reading Challenge — Leaderboard · Westminster</title>

  <!-- ╔══════════════════════════════════════════════════════════════════╗
       ║  EDIT DATA HERE — update names & points, then save & push       ║
       ║  Only change the VALUES (text in quotes, numbers after : )      ║
       ║  Do NOT change the words: name, points, grades, students        ║
       ╚══════════════════════════════════════════════════════════════════╝ -->
  <script>
    var READING_DATA = {

      lastUpdated: "May 23, 2026",  // ← update this date when you make changes

      grades: [
        {
          name: "2nd Grade",
          students: [
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
          ]
        },
        {
          name: "3rd Grade",
          students: [
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
          ]
        },
        {
          name: "4th Grade",
          students: [
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
          ]
        },
        {
          name: "5th Grade",
          students: [
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
            { name: "Student Name", points: 0 },
          ]
        },
      ]
    };
  </script>
  <!-- ══════════════════════════════════════════════════════════════════ -->

  <!-- Montserrat — closest free match to Gotham -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design tokens ─────────────────────────────────────── */
    :root {
      --green:        #2c5234;
      --green-mid:    #3d7348;
      --green-light:  #5a9e6f;
      --green-pale:   #e8f2ea;
      --gold:         #c9a227;
      --gold-bg:      #fffbe8;
      --gold-light:   #f5d87e;
      --silver:       #c8c8c8;
      --bronze:       #cd7f32;
      --bg:           #f0f4f1;
      --white:        #ffffff;
      --text:         #1a2e1e;
      --text-mid:     #3a5a42;
      --text-soft:    #7a9e82;
      --divider:      #e4ede6;
    }

    /* ── Base ──────────────────────────────────────────────── */
    body {
      font-family: 'Gotham', 'Montserrat', 'Century Gothic', Arial, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Site header ───────────────────────────────────────── */
    .site-header {
      background: var(--green);
      padding: 28px 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .school-name {
      font-size: .7rem;
      font-weight: 700;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 10px;
    }

    .page-title {
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      line-height: 1.08;
      color: #ffffff;
    }

    .page-title .accent { color: var(--gold); }

    /* Sprout image */
    .sprout-wrap {
      flex-shrink: 0;
      width: clamp(100px, 12vw, 155px);
    }
    .sprout-wrap img {
      width: 100%;
      height: auto;
      display: block;
      mix-blend-mode: screen; /* makes the black background transparent */
    }

    /* ── Updated bar ───────────────────────────────────────── */
    .updated-bar {
      background: var(--green-mid);
      color: rgba(255,255,255,.75);
      text-align: center;
      padding: 6px 20px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── Main container ────────────────────────────────────── */
    .container {
      max-width: 1160px;
      margin: 0 auto;
      padding: 36px 28px 72px;
    }

    /* ── 2-column grade grid ───────────────────────────────── */
    .grades-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 26px;
    }

    /* ── Grade card ────────────────────────────────────────── */
    .grade-card {
      background: var(--white);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 2px 18px rgba(44,82,52,.10);
      animation: rise .45s ease both;
    }
    .grade-card:nth-child(1) { animation-delay: .05s; }
    .grade-card:nth-child(2) { animation-delay: .12s; }
    .grade-card:nth-child(3) { animation-delay: .19s; }
    .grade-card:nth-child(4) { animation-delay: .26s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Grade card header band */
    .card-header {
      background: var(--green);
      padding: 14px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-grade-name {
      font-size: .85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      color: #ffffff;
    }

    .card-header-label {
      font-size: .62rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-light);
    }

    /* ── Student rows ──────────────────────────────────────── */
    .student-row {
      display: grid;
      grid-template-columns: 52px 1fr auto;
      align-items: center;
      padding: 11px 22px;
      border-bottom: 1px solid var(--divider);
      transition: background .12s;
    }
    .student-row:last-child { border-bottom: none; }
    .student-row:hover { background: #f4fbf6; }

    .student-row.rank-1 { background: var(--gold-bg); }
    .student-row.rank-1:hover { background: #fff5cc; }

    /* Rank circle */
    .rank-circle {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      font-weight: 900;
    }
    .rank-circle.gold   { background: var(--gold);    color: #4a2e00; }
    .rank-circle.silver { background: var(--silver);  color: #333;    }
    .rank-circle.bronze { background: var(--bronze);  color: #3a1800; }
    .rank-circle.plain  { background: var(--green-pale); color: var(--text-mid); }

    /* Name */
    .s-name {
      padding: 0 14px;
      font-size: .92rem;
      font-weight: 600;
      color: var(--text);
    }
    .rank-1 .s-name { font-weight: 800; }
    .student-row.empty .s-name {
      color: var(--text-soft);
      font-style: italic;
      font-weight: 400;
    }

    /* Points */
    .s-pts-wrap { text-align: right; }
    .s-pts {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--green);
      line-height: 1;
    }
    .rank-1 .s-pts { color: var(--gold); }
    .student-row.empty .s-pts { color: #d8d8d8; }

    .s-pts-label {
      font-size: .6rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    /* ── Footer ────────────────────────────────────────────── */
    .site-footer {
      text-align: center;
      padding: 24px;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    /* ── Responsive ────────────────────────────────────────── */
    @media (max-width: 640px) {
      .site-header { flex-direction: column; text-align: center; padding: 28px 24px; }
      .grades-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="site-header">
    <div>
      <div class="school-name">Westminster Christian School</div>
      <h1 class="page-title">Summer Reading<br><span class="accent">Leaderboard</span></h1>
    </div>
    <div class="sprout-wrap" aria-label="Sprout the reading mascot">
      <img src="sprout.png" alt="Sprout">
    </div>
  </header>

  <div class="updated-bar" id="updatedBar"></div>

  <!-- ── Content ─────────────────────────────────────────── -->
  <main class="container">
    <div class="grades-grid" id="gradesGrid"></div>
    <div class="site-footer">
      Grades 2 &ndash; 5 &nbsp;&middot;&nbsp; AR Points Challenge &nbsp;&middot;&nbsp; Westminster Christian School &nbsp;&middot;&nbsp; 2026
    </div>
  </main>

  <!-- ── Render script ────────────────────────────────────── -->
  <script>
    function badgeClass(rank) {
      if (rank === 1) return 'gold';
      if (rank === 2) return 'silver';
      if (rank === 3) return 'bronze';
      return 'plain';
    }

    function fmt(n) {
      return Number(n).toLocaleString();
    }

    function render() {
      var data = READING_DATA;

      if (!data) {
        document.getElementById('gradesGrid').innerHTML =
          '<p style="color:#c0392b;padding:32px;text-align:center;font-weight:700;">' +
          'Data not found — check the READING_DATA block at the top of this file.</p>';
        return;
      }

      // Updated bar
      document.getElementById('updatedBar').textContent =
        data.lastUpdated ? 'Last updated: ' + data.lastUpdated : '';

      var grid = document.getElementById('gradesGrid');
      grid.innerHTML = '';

      data.grades.forEach(function(grade) {
        // Sort students by points descending, top 5
        var students = grade.students.slice().sort(function(a, b) {
          return b.points - a.points;
        }).slice(0, 5);

        var card = document.createElement('div');
        card.className = 'grade-card';

        // Header band
        card.innerHTML =
          '<div class="card-header">' +
            '<div class="card-grade-name">' + grade.name + '</div>' +
            '<div class="card-header-label">AR Points</div>' +
          '</div>';

        // Student rows
        students.forEach(function(s, i) {
          var rank = i + 1;
          var isEmpty = (s.points === 0 || !s.name ||
                         s.name.toLowerCase().indexOf('student') !== -1);

          var row = document.createElement('div');
          row.className = 'student-row rank-' + rank + (isEmpty ? ' empty' : '');

          row.innerHTML =
            '<div class="rank-circle ' + badgeClass(rank) + '">' + rank + '</div>' +
            '<div class="s-name">' + (isEmpty ? 'Open' : s.name) + '</div>' +
            '<div class="s-pts-wrap">' +
              '<div class="s-pts">' + (isEmpty ? '&mdash;' : fmt(s.points)) + '</div>' +
              '<div class="s-pts-label">pts</div>' +
            '</div>';

          card.appendChild(row);
        });

        grid.appendChild(card);
      });
    }

    render();
  </script>

</body>
</html>
